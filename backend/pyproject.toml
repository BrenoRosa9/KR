[project]
name = "kr-comparador"
version = "0.1.0"
description = "Comparador de documentos técnicos de georreferenciamento"
requires-python = ">=3.12"

# Núcleo: parsing, geodésia, matching e comparação. Instalável sozinho, sem
# banco e sem servidor, para que os testes do domínio rodem em qualquer máquina.
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pyproj>=3.6",
    "shapely>=2.0",
    "pdfplumber>=0.11",
    "pypdfium2>=4.30",
    "pikepdf>=9.0",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
# Servidor. Separado porque o núcleo precisa rodar sem Postgres para testar.
server = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "argon2-cffi>=23.1",
    "itsdangerous>=2.2",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
]
# OCR e geração de PDF exigem binários do sistema (Tesseract, Ghostscript,
# Pango). Instalados só na imagem Docker.
ocr = ["ocrmypdf>=16.0", "pytesseract>=0.3.10"]
report = ["jinja2>=3.1", "weasyprint>=62.0", "openpyxl>=3.1"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 90
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# `Depends(...)` e `File(...)` no valor padrão são a forma como o FastAPI
# declara dependências; a regra B008 existe para outro contexto.
"app/api/*.py" = ["B008"]
"app/deps.py" = ["B008"]
"app/main.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
disallow_untyped_defs = false
